<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSwift - Innovative Software Solutions</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <img src="logo.png" alt="CodeSwift Logo">
            </div>
            <div class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#">Services</a>
                <a href="#">About</a>
                <a href="#">Career</a>
                <button class="contact-btn">Contact us</button>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Innovative <span class="highlight">Software Solutions</span> for the future</h1>
            <p>At CodeSwift, we deliver tailored IT solutions that drive business growth. With expertise in software development, cloud services, and IT consulting.</p>
            <div class="cta-buttons">
                <button class="btn primary">Contact Us</button>
                <button class="btn secondary">View All Solutions</button>
            </div>
        </div>
        <div class="hero-graphics">
            <img src="cursor.png" alt="Cursor Icon" class="cursor-icon">
            <img src="speech-bubble.png" alt="Speech Bubble Icon" class="speech-bubble">
        </div>
    </section>

    <!-- Clients Section -->
    <section class="clients">
        <p>Trusted by the world's most innovative teams</p>
        <div class="client-logos">
            <img src="acme-corp.png" alt="Acme Corp">
            <img src="quantum.png" alt="Quantum">
            <img src="echo-valley.png" alt="Echo Valley">
            <img src="celestial.png" alt="Celestial">
            <img src="pulse.png" alt="PULSE">
            <img src="apex.png" alt="APEX">
        </div>
    </section>
</body>
</html>
